[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedos"
dynamic = ["version"]
description = "Local-first AI copilot for LinkedIn personal branding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    # Cosine similarity over stored embeddings in ai/memory.py. Already present as a
    # pandas dependency; declared directly because we import it directly.
    "numpy>=2",
    "pandas>=2.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "streamlit>=1.40",
    "tenacity>=9",
]

[project.scripts]
linkedos = "linkedos.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/linkedos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedos"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Alembic owns these files: generated from a template, named by revision hash, and
# `op`/`sa` are imported whether or not a given revision uses them. Autogenerated
# bodies are not line-wrapped or import-sorted to our taste, and hand-fixing them on
# every revision is churn with no reader.
"alembic/versions/*" = ["ANN", "E501", "F401", "I001", "N999"]
# Streamlit discovers multipage entries by filename and orders them by the numeric
# prefix, so `1_content.py` is required and is not an importable module name.
"src/linkedos/ui/pages/*" = ["N999"]
# pytest injects fixtures as arguments; requesting one for its side effect is the point.
# ARG001 covers test functions, ARG002 the same thing on methods of test classes.
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "llm: requires a real LLM provider; excluded from `make check`",
]

[tool.coverage.run]
source = ["src/linkedos"]
branch = true
